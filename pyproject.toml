[project]
name = "tt-news-scraper"
version = "0.4.0"
description = "Trinidad and Tobago news scraper using Guardian TT as source"
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "pytest>=9.2.0",
    "requests>=2.31.0",
    "responses>=0.26.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]
[tool.ruff.lint]
ignore = [
    "BLE001",  # Blind exception catches are intentional in scraper for graceful degradation
    "FA100",
    "UP045"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
