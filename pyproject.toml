[project]
name = "tt-news-scraper"
version = "0.1.0"
description = "Trinidad and Tobago news scraper using Guardian TT as source"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
