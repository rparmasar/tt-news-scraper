[project]
name = "tt-news-scraper"
version = "0.1.0"
description = "Scrape Trinidad & Tobago news headlines from Trinidad Express"
readme = "README.md"
authors = [
    { name = "Rajeev Parmasar", email = "rajeev@parmasar.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.1.0",
]

[project.scripts]
tt-news-scraper = "tt_news_scraper:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
