[project]
name = "tt-news-scraper"
version = "0.4.5"
readme = "README.md"
description = "Trinidad and Tobago news scraper using Guardian & Express as sources"
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "pytest>=9.2.0",
    "requests>=2.31.0",
    "responses>=0.26.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]
[tool.ruff.lint]
ignore = [
    "BLE001",  # Blind exception catches are intentional in scraper for graceful degradation
    "FA100", # Optional type hints are okay
    "UP045" # Optional type hints are okay
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[project.scripts]
ttns = "tt_news_scraper.main:main"
