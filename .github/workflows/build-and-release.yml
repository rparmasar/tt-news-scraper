name: Build & Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Configure git identity for tagging
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"
      
      - name: Bump version from conventional commits
        run: |
          # Get last tag
          LAST_TAG=$(git describe --tags --abbrev=0)
          
          # Extract commit types between last tag and HEAD (inclusive)
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")
          
          # Check for highest priority type first, then fall through to lower priorities
          if echo "$COMMITS" | grep -qE 'BREAKING CHANGE!'; then
            VERSION_BUMP="major"
          elif echo "$COMMITS" | grep -qE '(feat|perf)' ; then
            VERSION_BUMP="minor"
          elif echo "$COMMITS" | grep -qE '(fix|refactor)' ; then
            VERSION_BUMP="patch"
          else
            # Default to patch if no conventional commits found
            VERSION_BUMP="patch"
          fi
          
          echo "Bumping version by: $VERSION_BUMP"
          uv version --bump $VERSION_BUMP

      - name: Commit and push version bump (skip CI)
        run: |
          # Use [skip ci] marker to prevent re-triggering on this commit
          git add pyproject.toml
          git commit --no-verify -m "[skip ci] chore: bump version via CI" || echo "No changes to commit"
          git push origin HEAD

      - name: Build distributions
        run: uv build

      - name: Create release tag
        run: |
          VERSION=$(uv version --short)
          echo "Creating tag v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}